version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hiresense_postgres
    environment:
      POSTGRES_USER: hiresense_user
      POSTGRES_PASSWORD: hiresense_password
      POSTGRES_DB: hiresense_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiresense_user -d hiresense_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
